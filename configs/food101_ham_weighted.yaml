# HAM: fusión ponderada de scores, softmax(λ·s_dot + (1-λ)·s_bahdanau), λ fijo.
# ATENCIÓN: additive_free materializa [B,N,N,d]; estimado ~65 GB (batch 128, N=577) de memoria de GPU.
# Sólo para GPUs grandes (fase 4 de scripts/run_paper.sh).
base: _food101.yaml
model:
  attention:
    branches: [dot, additive_free]
    fusion: weighted_score
    fusion_kwargs: {lambda_: 0.85, learnable: false}
